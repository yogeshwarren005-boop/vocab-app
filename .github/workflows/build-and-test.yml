name: Build & Verify Mobile App

on:
  push:
    branches: [ main, master ]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Database & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'main app/package-lock.json'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📥 Install npm dependencies
        working-directory: './main app'
        run: npm ci || npm install

      - name: 🔍 Verify Database Structure & Notes Integrity
        working-directory: './main app'
        run: npm run verify-db

      - name: ⚡ Build Vault Index & Preloaded Cache
        working-directory: './main app'
        run: npm run index

      - name: 🔄 Sync Capacitor Assets to Android Container
        working-directory: './main app'
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Debug APK
        working-directory: './android'
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-vocab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
