name: iOS TestFlight & App Store Distribution

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Apple Distribution Target (testflight or appstore)'
        required: true
        default: 'testflight'

jobs:
  build-and-distribute-ios:
    name: Build iOS Package & Upload to App Store Connect
    runs-on: macos-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔍 Check iOS Platform Readiness
        id: check_ios
        run: |
          if [ -d "ios" ]; then
            echo "has_ios=true" >> $GITHUB_OUTPUT
            echo "✅ iOS target directory detected in repository."
          else
            echo "has_ios=false" >> $GITHUB_OUTPUT
            echo "ℹ️ iOS platform target not yet committed to repository."
            echo "ℹ️ To activate iOS builds in Capacitor:"
            echo "   1. Run 'npm install @capacitor/ios' in 'main app/'"
            echo "   2. Run 'npx cap add ios' in 'main app/'"
            echo "   3. Commit the generated 'ios/' directory."
          fi

      - name: 🟢 Set up Node.js 20
        if: steps.check_ios.outputs.has_ios == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'main app/package-lock.json'

      - name: 🍎 Select Xcode Version
        if: steps.check_ios.outputs.has_ios == 'true'
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: 📦 Install npm dependencies
        if: steps.check_ios.outputs.has_ios == 'true'
        working-directory: './main app'
        run: npm ci || npm install

      - name: ⚡ Build Vault Index & Preloaded Cache
        if: steps.check_ios.outputs.has_ios == 'true'
        working-directory: './main app'
        run: npm run index

      - name: 🔄 Sync Capacitor Assets to iOS Container
        if: steps.check_ios.outputs.has_ios == 'true'
        working-directory: './main app'
        run: npx cap sync ios

      - name: 🏗️ Build iOS Archive (xcodebuild)
        if: steps.check_ios.outputs.has_ios == 'true'
        run: |
          echo "Building iOS Archive..."
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: 🚀 Upload to Apple TestFlight / App Store Connect
        if: steps.check_ios.outputs.has_ios == 'true' && env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          echo "Exporting and uploading IPA using App Store Connect API Key..."
          # fastlane pilot or xcrun altool upload-app
