name: Release Mobile Application

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v1.1.0)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Release Title'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Native Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Extract Version from Tag / Input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' if present for clean semver
          VERSION="${RAW_TAG#v}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Building Release for Tag: ${TAG} (Version: ${VERSION})"

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'main app/package-lock.json'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📥 Install npm dependencies
        working-directory: './main app'
        run: npm ci || npm install

      - name: 🔍 Verify Database Structure & Notes Integrity
        working-directory: './main app'
        run: npm run verify-db

      - name: ⚡ Build In-Memory Vault Index & Preloaded Cache
        working-directory: './main app'
        run: npm run index

      - name: 🔄 Sync Web Assets into Native Android Container
        working-directory: './main app'
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build Native Android APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Android Release Keystore detected. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            
            export KEYSTORE_FILE="release.keystore"
            cd android
            ./gradlew assembleRelease --stacktrace
            cd ..
            
            RELEASE_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            cp "$RELEASE_APK" "release-artifacts/ObsidianVocab-${TAG}.apk"
          else
            echo "ℹ️ No release keystore secrets found. Building release/debug ready APK..."
            cd android
            ./gradlew assembleDebug --stacktrace
            cd ..
            
            DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
            cp "$DEBUG_APK" "release-artifacts/ObsidianVocab-${TAG}.apk"
          fi
          
          echo "✅ Release package generated at: release-artifacts/ObsidianVocab-${TAG}.apk"

      - name: 🔒 Generate SHA-256 Checksums
        working-directory: './release-artifacts'
        run: |
          sha256sum "ObsidianVocab-${{ env.TAG }}.apk" > checksums.txt
          echo "Artifact Checksum:"
          cat checksums.txt

      - name: 🚀 Publish GitHub Release with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ github.event.inputs.release_title != '' && github.event.inputs.release_title || format('Obsidian Vocab Mobile {0}', env.TAG) }}
          files: |
            release-artifacts/ObsidianVocab-${{ env.TAG }}.apk
            release-artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
