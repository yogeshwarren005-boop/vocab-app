<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explore Tab Redesign — 5 Interactive UI Mockups</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #121417;
      --surface-1: #1a1e24;
      --surface-2: #242933;
      --surface-3: #2e3542;
      --border: #384152;
      --text: #f0f3f8;
      --text-muted: #9ba3b4;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --radius: 12px;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP GLOBAL CONTROLLER (FOR TESTING 5 MOCKUPS) */
    .mockup-controller-bar {
      background: #0b0d10;
      border-bottom: 2px solid #2a313d;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 100;
    }

    .controller-title {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    .controller-title span {
      background: var(--accent);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }

    .mockup-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mockup-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .mockup-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .mockup-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .word-tester-dropdown {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
    }

    /* PHONE SHELL PREVIEW CONTAINER */
    .viewport-canvas {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2029 0%, #0d0f13 100%);
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 840px;
      background: #14171d;
      border: 3px solid #2e3544;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
    }

    .phone-notch {
      height: 26px;
      background: #0d0f13;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 700;
      color: #8b95a8;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .phone-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* LOCKED SEARCH BAR CAPSULE */
    .search-panel-container {
      padding: 10px 14px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
    }

    .locked-search-box {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .locked-search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .google-g-icon {
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--google-blue), var(--google-red), var(--google-yellow), var(--google-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .locked-word-token {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
    }

    .locked-icon-badge {
      font-size: 10px;
    }

    .locked-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12.5px;
      font-family: inherit;
    }

    .locked-search-input::placeholder {
      color: #6c788d;
      font-style: italic;
    }

    .btn-search-go {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ----------------------------------------------------
       MOCKUP 1: CHROME / ARC HYBRID TAB STRIP
       ---------------------------------------------------- */
    .tab-strip-m1 {
      display: flex;
      align-items: center;
      background: #0f1217;
      border-bottom: 1px solid var(--border);
      padding: 6px 10px 0 10px;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-m1 {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 8px 12px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: all 0.15s ease;
    }

    .tab-m1.active {
      background: var(--surface-1);
      color: #fff;
      border-color: var(--border);
      border-top: 2px solid var(--accent);
    }

    .tab-m1 .tab-close {
      font-size: 10px;
      color: #7b889e;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-m1 .tab-close:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .btn-add-tab {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      margin-bottom: 4px;
      transition: all 0.15s ease;
    }

    .btn-add-tab:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* ----------------------------------------------------
       MOCKUP 2: FLOATING PILL DOCK (SAFARI LIQUID STYLE)
       ---------------------------------------------------- */
    .tab-strip-m2 {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(26, 30, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-m2 {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-m2.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000;
      border-color: #10b981;
      font-weight: 800;
    }

    /* ----------------------------------------------------
       MOCKUP 3: EDITORIAL NOTION-STYLE DECK
       ---------------------------------------------------- */
    .tab-strip-m3 {
      display: flex;
      align-items: center;
      background: #14171d;
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-m3 {
      padding: 12px 14px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }

    .tab-m3.active {
      color: #fff;
    }

    .tab-m3.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10px;
      right: 10px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px;
    }

    /* ----------------------------------------------------
       MOCKUP 4: BENTO THUMBNAIL CARDS
       ---------------------------------------------------- */
    .tab-strip-m4 {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #0f1217;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .tab-m4 {
      flex: 0 0 96px;
      height: 52px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      position: relative;
    }

    .tab-m4.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      color: #fff;
    }

    .tab-m4-badge {
      font-size: 8px;
      padding: 2px 4px;
      border-radius: 4px;
      background: var(--surface-3);
      width: fit-content;
    }

    /* ----------------------------------------------------
       MOCKUP 5: OBSIDIAN CODE-TAB COCKPIT
       ---------------------------------------------------- */
    .tab-strip-m5 {
      display: flex;
      align-items: center;
      background: #090a0d;
      border-bottom: 1px solid #202633;
      padding: 4px 6px 0 6px;
      gap: 3px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-m5 {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 6px 10px;
      background: #11141b;
      border: 1px solid #202633;
      border-bottom: none;
      color: #6b778c;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .tab-m5.active {
      background: #181d26;
      color: #4ade80;
      border-color: #2e384b;
    }

    /* ACTIVE TAB VIEWPORT CONTENT */
    .active-tab-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-preview {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }

    .preview-tag {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .image-grid-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .image-thumb-box {
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #000;
      position: relative;
      border: 1px solid var(--border);
    }

    .image-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-caption {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      background: rgba(0,0,0,0.75);
      font-size: 9.5px;
      padding: 4px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-card-preview {
      display: flex;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      align-items: center;
    }

    .video-thumb {
      width: 90px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #000;
    }

    .video-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .google-search-preview-card {
      background: #1c212b;
      border: 1px solid #364052;
      border-left: 3px solid var(--google-blue);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toast-locked-alert {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(234, 67, 53, 0.95);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 50;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- TOP GLOBAL CONTROLLER BAR -->
  <div class="mockup-controller-bar">
    <div class="controller-title">
      🧭 5 Explore UI Mockups <span>Interactive Preview</span>
    </div>

    <div class="mockup-pills">
      <button class="mockup-btn" data-mockup="1">1. Arc/Chrome</button>
      <button class="mockup-btn" data-mockup="2">2. Safari Liquid</button>
      <button class="mockup-btn" data-mockup="3">3. Notion</button>
      <button class="mockup-btn" data-mockup="4">4. Bento Cards</button>
      <button class="mockup-btn" data-mockup="5">5. Obsidian</button>
      <button class="mockup-btn active" data-mockup="6" style="border-color:#4285f4; color:#8ab4f8; font-weight:800;">6. Google Chrome + AI Overview</button>
    </div>

    <div>
      <select class="word-tester-dropdown" id="wordSelector">
        <option value="blastema" data-cat="Scientific">Word: blastema (Scientific)</option>
        <option value="magnanimous" data-cat="Philosophical">Word: magnanimous (Philosophical)</option>
        <option value="ephemeral" data-cat="Temporal">Word: ephemeral (Temporal)</option>
        <option value="bellicose" data-cat="Conflict">Word: bellicose (Conflict)</option>
        <option value="mellifluous" data-cat="Aesthetic">Word: mellifluous (Aesthetic)</option>
        <option value="pragmatic" data-cat="Conversational">Word: pragmatic (Conversational)</option>
      </select>
    </div>
  </div>

  <!-- PHONE VIEWPORT CANVAS -->
  <div class="viewport-canvas">
    <div class="phone-shell">
      
      <!-- Fake Phone Notch -->
      <div class="phone-notch">
        <span>9:41</span>
        <span>Word Explorer Mobile</span>
        <span>100% 🔋</span>
      </div>

      <div class="phone-content">

        <!-- 1. LOCKED SEARCH BAR CAPSULE (WITH LOCKED WORD TOKEN) -->
        <div class="search-panel-container">
          <form class="locked-search-box" id="lockedSearchForm" onsubmit="handleSearchSubmit(event)">
            <span class="google-g-icon">G</span>
            
            <!-- THE LOCKED WORD BADGE: Cannot be deleted -->
            <div class="locked-word-token" id="lockedWordBadge" title="Word is locked to this card">
              <span class="locked-icon-badge">🔒</span>
              <span id="lockedWordText">blastema</span>
            </div>

            <!-- Freeform user query appended to the locked word -->
            <input
              type="text"
              id="searchModifierInput"
              class="locked-search-input"
              placeholder="+ add extra terms to search..."
              autocomplete="off"
            />

            <button type="submit" class="btn-search-go">Search</button>
          </form>
        </div>

        <!-- 2. TOP NAVIGATABLE TAB BAR (DYNAMICALLY SWAPPED BY MOCKUP SELECTOR) -->
        <div id="tabStripMount">
          <!-- Mounted dynamically by JS -->
        </div>

        <!-- 3. ACTIVE TAB VIEWPORT CONTENT FEED -->
        <div class="active-tab-viewport" id="tabViewportContent">
          <!-- Content injected dynamically -->
        </div>

        <!-- Toast alert when user tries to delete the locked word -->
        <div class="toast-locked-alert" id="lockedToast">
          🔒 Word is locked! Search queries always anchor to this word.
        </div>

      </div>
    </div>
  </div>

  <script>
    // State
    let currentMockup = 6;
    let currentWord = 'blastema';
    let currentCategory = 'Scientific';
    let currentTabId = 'wiki';
    let customTabsCount = 0;

    // 6 Category-adaptive sources
    const categorySources = {
      Scientific: [
        { id: 'wiki', name: 'Wikipedia', icon: '📖', desc: 'Anatomical Specimen Definition' },
        { id: 'images', name: 'Images & Schematics', icon: '🔬', desc: 'Micrographs & Cellular Diagrams' },
        { id: 'videos', name: 'Video Labs', icon: '🎬', desc: 'Laboratory Regeneration Clips' },
        { id: 'pubmed', name: 'PubMed / Journals', icon: '🧬', desc: 'Peer-reviewed Cellular Data' },
        { id: 'taxonomy', name: 'Morpheme Specimen', icon: '🏛️', desc: 'Greco-Latin combining forms' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ],
      Philosophical: [
        { id: 'wiki', name: 'Wikipedia / SEP', icon: '📖', desc: 'Stanford Encyclopedia of Philosophy' },
        { id: 'images', name: 'Allegory Art', icon: '🏛️', desc: 'Classical Statues & Art' },
        { id: 'videos', name: 'Lecture Clips', icon: '🎬', desc: 'Dialectic & Ethics Seminars' },
        { id: 'virtue', name: 'Virtue Compass', icon: '⚖️', desc: 'Aristotelian Mean & Deficiency' },
        { id: 'sources', name: 'Classical Texts', icon: '📜', desc: 'Seneca, Marcus Aurelius, Kant' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ],
      Temporal: [
        { id: 'wiki', name: 'Wikipedia', icon: '📖', desc: 'Chronological Term Dynamics' },
        { id: 'images', name: 'Time-Series', icon: '⏳', desc: 'Chrono-photography & Decay' },
        { id: 'videos', name: 'Time-Lapse Videos', icon: '🎬', desc: 'Evanescence & Duration' },
        { id: 'scale', name: 'Chrono-Scrubber', icon: '⚡', desc: 'Lifespan Analogy Meter' },
        { id: 'sources', name: 'Literary Passages', icon: '📜', desc: 'Classical Citations on Transience' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ],
      Conflict: [
        { id: 'wiki', name: 'Wikipedia', icon: '📖', desc: 'Military & Rhetorical Analysis' },
        { id: 'images', name: 'Strategic Maps', icon: '⚔️', desc: 'Historical Battle Imagery' },
        { id: 'videos', name: 'Speeches & Debates', icon: '🎬', desc: 'Diplomatic & Martial Clips' },
        { id: 'ladder', name: 'Escalation Ladder', icon: '🚨', desc: '4-Stage Belligerence Meter' },
        { id: 'sources', name: 'Diplomatic Archives', icon: '📜', desc: 'Treaties & War Records' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ],
      Aesthetic: [
        { id: 'wiki', name: 'Wikipedia', icon: '📖', desc: 'Poetics & Sensory Sonority' },
        { id: 'images', name: 'Fine Art Gallery', icon: '🎨', desc: 'Metropolitan Museum Plates' },
        { id: 'videos', name: 'Acoustic Readings', icon: '🎬', desc: 'Cadence & Lyric Poetry' },
        { id: 'synesthesia', name: 'Synesthesia Studio', icon: '🎶', desc: 'Tactile, Acoustic, Visual' },
        { id: 'sources', name: 'Lyric Poetry Corpus', icon: '📜', desc: 'Keats, Milton, Shakespeare' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ],
      Conversational: [
        { id: 'wiki', name: 'Wiktionary', icon: '📖', desc: 'Lexical Corpus & Etymology' },
        { id: 'images', name: 'Contextual Realia', icon: '💬', desc: 'Workplace & Discourse Situations' },
        { id: 'videos', name: 'Pronunciation Clips', icon: '🎬', desc: 'Native Speaker Cadence' },
        { id: 'register', name: '5-Tier Register Dial', icon: '🗣️', desc: 'Slang to Academic Equalizer' },
        { id: 'sources', name: 'Modern Collocations', icon: '📰', desc: 'Contemporary Usage Matrix' },
        { id: 'google', name: 'Google Explorer', icon: '🔍', desc: 'Anchored Web Search' }
      ]
    };

    let activeTabsList = [];

    function initTabs() {
      const base = categorySources[currentCategory] || categorySources.Scientific;
      activeTabsList = [...base];
      currentTabId = activeTabsList[0].id;
      renderMockup();
      renderContent();
    }

    // Render the selected mockup tab bar
    function renderMockup() {
      const mount = document.getElementById('tabStripMount');
      let html = '';

      if (currentMockup === 1) {
        // Mockup 1: Arc / Chrome Hybrid
        html = `
          <div class="tab-strip-m1">
            ${activeTabsList.map(t => `
