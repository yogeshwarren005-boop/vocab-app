<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Direct Google Embed Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #202124;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header {
      background: #303134;
      color: #e8eaed;
      padding: 10px 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #3c4043;
    }
    iframe {
      flex: 1;
      width: 100%;
      height: calc(100vh - 45px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🔒 Word: <b>bonny</b></span>
    <span>• Live Native Google Embed (igu=1)</span>
  </div>
  <iframe src="https://www.google.com/search?igu=1&q=bonny" allow="microphone; camera" allowfullscreen></iframe>
</body>
</html>
